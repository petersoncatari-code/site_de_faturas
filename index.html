<script>
document.addEventListener("DOMContentLoaded", () => {
  // ====== SUPABASE ======
  const SUPABASE_URL = "https://gvvdiddmlubezpshkkpl.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd2dmRpZGRtbHViZXpwc2hra3BsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ4Mjc4NjcsImV4cCI6MjA4MDQwMzg2N30.-BDleSCFaEQRkmzv1_-L9gQD6ogAYFYJBfQJj-YC9yM";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let carrinho = [];

  const produtosDefault = [
    {id:1, nome:"Arroz 5kg", preco:4500, stock:10},
    {id:2, nome:"Óleo 1L", preco:1200, stock:20},
    {id:3, nome:"Farinha 1kg", preco:800, stock:15},
    {id:4, nome:"Macarrão 500g", preco:600, stock:25}
  ];

  async function carregarProdutos(filter = "") {
    let produtosBD;
    try {
      const { data, error } = await supabaseClient
        .from("produtos")
        .select("*")
        .ilike("nome", `%${filter}%`)
        .gt("stock", 0);
      if (error) throw error;
      produtosBD = data.length > 0 ? data : produtosDefault;
    } catch (e) {
      produtosBD = produtosDefault; // fallback se Supabase falhar
    }

    const container = document.getElementById("produtosList");
    container.innerHTML = "";
    produtosBD.forEach(p => {
      if (!p.nome.toLowerCase().includes(filter.toLowerCase())) return;
      const div = document.createElement("div");
      const span = document.createElement("span");
      span.textContent = `${p.nome} - ${p.preco} Kz - Estoque: ${p.stock}`;
      const btn = document.createElement("button");
      btn.textContent = "Adicionar";
      btn.className = "bg-blue-500 text-white px-2 py-1 rounded";
      btn.addEventListener("click", () => adicionarAoCarrinho(p.id, p.nome, p.preco, p.stock));
      div.appendChild(span);
      div.appendChild(btn);
      container.appendChild(div);
    });
  }

  document.getElementById("searchProduto").addEventListener("input", e => {
    carregarProdutos(e.target.value);
  });

  function adicionarAoCarrinho(id, nome, preco, stock) {
    if (stock <= 0) return alert("Sem estoque!");
    const itemExistente = carrinho.find(i => i.id === id);
    if (itemExistente) {
      if (itemExistente.quantidade < stock) itemExistente.quantidade++;
      else return alert("Não há mais estoque disponível");
    } else {
      carrinho.push({ id, nome, preco, quantidade: 1 });
    }
    atualizarCarrinho();
  }

  function atualizarCarrinho() {
    const container = document.getElementById("carrinho");
    container.innerHTML = "";
    let total = 0;
    carrinho.forEach((item, i) => {
      total += item.preco * item.quantidade;
      const div = document.createElement("div");
      const span = document.createElement("span");
      span.textContent = `${item.nome} x${item.quantidade} — ${item.preco*item.quantidade} Kz`;
      const btn = document.createElement("button");
      btn.textContent = "X";
      btn.className = "bg-red-500 text-white px-1 rounded ml-2";
      btn.addEventListener("click", () => removerDoCarrinho(i));
      div.appendChild(span);
      div.appendChild(btn);
      container.appendChild(div);
    });
    document.getElementById("valorTotal").innerText = total + " Kz";
  }

  function removerDoCarrinho(i) {
    carrinho.splice(i, 1);
    atualizarCarrinho();
  }

  document.getElementById("btnFinalizar").addEventListener("click", () => {
    if (carrinho.length === 0) return alert("Carrinho vazio!");
    abrirModalFatura();
  });

  function abrirModalFatura() {
    const faturaDiv = document.getElementById("faturaDetalhes");
    let total = 0;
    let html = `<table>
      <tr><th>Produto</th><th>Preço unit.</th><th>Qtd</th><th>Subtotal</th></tr>`;
    carrinho.forEach(item => {
      const subtotal = item.preco * item.quantidade;
      total += subtotal;
      html += `<tr>
        <td>${item.nome}</td>
        <td>${item.preco} Kz</td>
        <td>${item.quantidade}</td>
        <td>${subtotal} Kz</td>
      </tr>`;
    });
    html += `<tr><th colspan="3">Total</th><th>${total} Kz</th></tr></table>`;
    faturaDiv.innerHTML = html;
    document.getElementById("faturaModal").style.display = "flex";
  }

  document.getElementById("btnFechar").addEventListener("click", () => {
    document.getElementById("faturaModal").style.display = "none";
  });

  carregarProdutos();
});
</script>
