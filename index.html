<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital 1.9 - Supabase</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"/>

<style>
body { font-family: sans-serif; background: #f0f4f8; margin:0; }
input, button { width:100%; margin-bottom:0.5rem; padding:0.5rem; border-radius:6px; border:1px solid #ccc; }
button { cursor:pointer; }
#adminArea, #clienteArea { margin-top:1rem; padding:1rem; border-radius:8px; }
#adminArea { background:#fee2e2; }
#clienteArea { background:#dbeafe; }
#produtosList div, #carrinho div, #faturasList div { margin-bottom:0.5rem; }
</style>

</head>
<body>

<div class="p-6">
  <h2>Bem-vindo, <span id="userEmail">Visitante</span></h2>

  <div id="adminArea">
    <p class="font-bold">Área do Administrador</p>
    <h3>Adicionar Produto</h3>
    <input type="text" id="nomeItem" placeholder="Nome do produto">
    <input type="number" id="precoItem" placeholder="Preço">
    <input type="number" id="quantidadeItem" placeholder="Quantidade">
    <button id="btnAddItem" class="bg-green-600 text-white font-bold">Adicionar Item</button>
  </div>

  <div id="clienteArea">
    <p class="font-bold">Área do Cliente</p>
    <h3>Produtos</h3>
    <div id="produtosList"></div>

    <h3>Carrinho</h3>
    <div id="carrinho"></div>

    <p>Total: <span id="valorTotal">0 Kz</span></p>
    <button id="btnFinalizar" class="bg-green-600 text-white font-bold">Finalizar Compra</button>
  </div>

  <h3>Faturas</h3>
  <div id="faturasList"></div>
</div>

<script>
const supabaseUrl = "https://gvvdiddmlubezpshkkpl.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd2dmRpZGRtbHViZXpwc2hra3BsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ4Mjc4NjcsImV4cCI6MjA4MDQwMzg2N30.-BDleSCFaEQRkmzv1_-L9gQD6ogAYFYJBfQJj-YC9yM";
const supabase = supabase.createClient(supabaseUrl, supabaseKey);

let carrinho = [];

// Configurar áreas (não há login, então já define como cliente/admin padrão)
document.getElementById("userEmail").innerText = "Usuário Padrão";
document.getElementById("adminArea").style.display = "block"; // ou "none" se quiser só cliente
document.getElementById("clienteArea").style.display = "block";

// ===== ADICIONAR ITEM (ADMIN) =====
document.getElementById("btnAddItem").addEventListener("click", async () => {
  const nome = nomeItem.value.trim();
  const preco = Number(precoItem.value);
  const quantidade = Number(quantidadeItem.value);
  if(!nome || preco<=0 || quantidade<=0) return alert("Preencha todos os campos corretamente");
  await supabase.from("itens").insert([{ nome, preco, stock: quantidade }]);
  alert("Item adicionado!");
  carregarProdutos();
});

// ===== CARREGAR PRODUTOS =====
async function carregarProdutos(){
  const { data } = await supabase.from("itens").select("*");
  const container = document.getElementById("produtosList");
  container.innerHTML = "";
  if(!data) return;
  data.forEach(p=>{
    const div = document.createElement("div");
    const btn = document.createElement("button");
    btn.textContent = "Adicionar";
    btn.className = "bg-blue-500 text-white px-2 py-1 rounded";
    btn.addEventListener("click", ()=>adicionarAoCarrinho(p.id, p.nome, p.preco, p.stock));
    div.textContent = `${p.nome} - ${p.preco} Kz - Estoque: ${p.stock} `;
    div.appendChild(btn);
    container.appendChild(div);
  });
}

// ===== CARRINHO =====
function adicionarAoCarrinho(id,nome,preco,stock){
  if(stock<=0) return alert("Sem estoque!");
  const itemExistente = carrinho.find(i=>i.id===id);
  if(itemExistente){
    if(itemExistente.quantidade<stock) itemExistente.quantidade++;
    else return alert("Não há mais estoque disponível");
  } else {
    carrinho.push({id,nome,preco,quantidade:1});
  }
  atualizarCarrinho();
}

function atualizarCarrinho(){
  const container = document.getElementById("carrinho");
  container.innerHTML = "";
  let total=0;
  carrinho.forEach((item,i)=>{
    total+=item.preco*item.quantidade;
    const div=document.createElement("div");
    const btn=document.createElement("button");
    btn.textContent="X";
    btn.className="bg-red-500 text-white px-1 rounded ml-2";
    btn.addEventListener("click",()=>removerDoCarrinho(i));
    div.textContent=`${item.nome} x${item.quantidade} — ${item.preco*item.quantidade} Kz`;
    div.appendChild(btn);
    container.appendChild(div);
  });
  document.getElementById("valorTotal").innerText=total+" Kz";
}

function removerDoCarrinho(i){
  carrinho.splice(i,1);
  atualizarCarrinho();
}

// ===== FINALIZAR COMPRA =====
document.getElementById("btnFinalizar").addEventListener("click", async()=>{
  if(carrinho.length===0) return alert("Carrinho vazio!");
  for(const item of carrinho){
    const { data:prod } = await supabase.from("itens").select("*").eq("id",item.id).limit(1).single();
    if(item.quantidade>prod.stock) return alert(`Estoque insuficiente de ${item.nome}`);
  }
  for(const item of carrinho){
    await supabase.from("vendas").insert([{usuario_id:1,item_id:item.id,quantidade:item.quantidade}]);
    const { data:prod } = await supabase.from("itens").select("*").eq("id",item.id).limit(1).single();
    await supabase.from("itens").update({stock:prod.stock-item.quantidade}).eq("id",item.id);
  }
  const totalCompra=carrinho.reduce((acc,i)=>acc+i.preco*i.quantidade,0);
  await supabase.from("faturas").insert([{usuario_id:1,total:totalCompra,metodo_pagamento:"Dinheiro",estado:"Pendente"}]);
  alert("Compra finalizada!");
  carrinho=[];
  atualizarCarrinho();
  carregarProdutos();
  carregarFaturas();
});

// ===== CARREGAR FATURAS =====
async function carregarFaturas(){
  const { data } = await supabase.from("faturas").select("*");
  const container=document.getElementById("faturasList");
  container.innerHTML="";
  if(!data) return;
  data.forEach(f=>{
    const div=document.createElement("div");
    div.innerText=`Fatura: ${f.id} - Total: ${f.total} Kz - Estado: ${f.estado}`;
    container.appendChild(div);
  });
}

// Carrega produtos e faturas ao iniciar
carregarProdutos();
carregarFaturas();
</script>

</body>
</html>
